architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage stays in the platform modules (fabric/ and forge/). Arsenal's `common` has none at all.

    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries: the Modrinth maven for the released ones, mavenLocal for the 1.20.1-modern ports.
    modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}")
    modImplementation("net.fabric_extras:shield_api-${platform}:${rootProject.shield_api_version}")
    modImplementation("net.foundation:ranged_weapon_api-${platform}:${rootProject.ranged_weapon_api_version}")
    modImplementation("net.spell_power:spell_power-${platform}:${rootProject.spell_power_version}")
    // `transitive = false`: SpellEngine's local-maven pom drags in Cardinal Components, whose
    // Loom-injected interfaces on `Entity` then fail to resolve here.
    modImplementation("net.spell_engine:spell_engine-${platform}:${rootProject.spell_engine_version}") { transitive = false }
}
