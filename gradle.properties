# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.1
minecraft_compat_version=1.20.1

# Loader
enabled_platforms = fabric,forge
fabric_loader_version=0.19.5
forge_version=1.20.1-47.4.22

# Mod
maven_group=net.arsenal
archives_name=arsenal
mod_version=1.5.0.002

# Dependencies
fabric_api_version=0.92.12+1.20.1
# Modrinth maven coordinates: maven.modrinth:tiny-config:<version>-<platform>
tiny_config_version=3.1.0+1.20.1
cloth_config_version=11.1.106
# PlayerAnimator 1.x (mod id `player-animator` on Fabric, `playeranimator` on Forge)
player_anim_version=1.0.2+1.19.4

# mavenLocal coordinates: net.fabric_extras:shield_api-<platform>:<version> (no game-version suffix).
# ShieldAPI 2.2.0.001 is the two-platform 1.20.1-modern port, so unique shields exist on Forge too.
shield_api_version=2.2.0.001
# mavenLocal coordinates: net.foundation:ranged_weapon_api-<platform>:<version>
# 2.3.4.008 is the two-platform 1.20.1-modern port (the legacy 1.1.x line was Fabric-only), and the
# first that registers through Forge's `RegisterEvent` helper instead of a locked `Registry.register`.
ranged_weapon_api_version=2.3.4.008+1.20.1
# mavenLocal coordinates: net.spell_power:spell_power-<platform>:<version>
spell_power_version=1.6.0.001+1.20.1
# mavenLocal coordinates: net.spell_engine:spell_engine-<platform>:<version>
# 1.10.5.004 is the first SE build whose `RangedWeapons` targets RangedWeaponAPI 2.3.4 (a hard floor:
# an older SE dies at class-init with `NoSuchMethodError: RangedConfig.<init>`). 1.10.5.034 adds the
# creation-only `…ToRegister` siblings the Forge entrypoint registers through.
spell_engine_version=1.10.5.034+1.20.1

# Fabric only
# Trinkets 3.7.2 is inherited transitively from SpellEngine; its nested Cardinal Components needs a dev pin.
trinkets_version=3.7.2
cardinal_components_version=5.2.0
mod_menu_version=7.2.1

# Forge only
curios_version=5.14.1+1.20.1
# Forge 47 does not bundle MixinExtras; SpellEngine JiJs it in production, but Loom does not load
# nested jars of classpath mods, so the dev runtime needs an explicit pin.
# >= 0.5.0 is REQUIRED alongside ShieldAPI 2.2.0.001 (sponge-mixin 0.17 emits `@Redirect.at` as `At[]`,
# which MixinExtras 0.4.1 casts straight to AnnotationNode and dies on during Bootstrap).
mixin_extras_version=0.5.5
